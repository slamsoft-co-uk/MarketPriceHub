<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Retrieve the best price sequence</title><desc id="desc">The controller validates the instrument ID and asks the price repository for the lowest price. It returns 200 when found, otherwise 404.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="return" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:13px}.head{font-size:14px;font-weight:bold}.reply{stroke:#64748b;stroke-dasharray:6 4}.call{stroke:#334155}.life{stroke:#94a3b8;stroke-dasharray:5 5}</style>
  </defs>
  <rect width="760" height="440" rx="10" fill="#fff"/><text x="24" y="32" font-size="21" font-weight="bold">Retrieve the best price</text>
  <g fill="#eaf2ff" stroke="#7193c6"><rect x="45" y="54" width="130" height="46" rx="6"/><rect x="315" y="54" width="130" height="46" rx="6"/><rect x="585" y="54" width="130" height="46" rx="6"/></g>
  <g class="head" text-anchor="middle"><text x="110" y="82">Client</text><text x="380" y="82">Controller</text><text x="650" y="82">Price repo</text></g>
  <g class="life"><path d="M110 100V350 M380 100V350 M650 100V350"/></g>
  <g fill="none" class="call" marker-end="url(#arrow)"><path d="M110 145H380"/><path d="M380 205H650"/></g>
  <g fill="none" class="reply" marker-end="url(#return)"><path d="M650 250H380"/><path d="M380 285H110"/></g>
  <g class="label" text-anchor="middle"><text x="245" y="138">GET best price by instrument</text><text x="380" y="178">Validate instrumentId</text><text x="515" y="198">findBestPriceByInstrumentId(...)</text><text x="515" y="243">Lowest Price or empty</text><text x="245" y="278">200 OK with Price, or 404</text></g>
  <rect x="45" y="370" width="670" height="42" rx="5" fill="#fff4e5" stroke="#f0bd73"/><text x="60" y="396" font-size="13">Invalid instrumentId returns 400 Bad Request; no matching price returns 404.</text>
</svg>
