<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Retrieve all prices sequence</title>
  <desc id="desc">The client requests all prices. The controller invokes the service, which retrieves every price and joins it with vendor and instrument details before sorting and returning the result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="return" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}
      .label{font-size:13px}
      .head{font-size:13px;font-weight:bold}
      .reply{stroke:#64748b;stroke-dasharray:6 4}
      .call{stroke:#334155}
      .life{stroke:#94a3b8;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="960" height="560" rx="10" fill="#fff"/>
  <text x="24" y="32" font-size="21" font-weight="bold">Retrieve all prices</text>

  <g fill="#eaf2ff" stroke="#7193c6">
    <rect x="25" y="54" width="120" height="46" rx="6"/>
    <rect x="205" y="54" width="130" height="46" rx="6"/>
    <rect x="395" y="54" width="130" height="46" rx="6"/>
    <rect x="585" y="54" width="130" height="46" rx="6"/>
    <rect x="775" y="54" width="160" height="46" rx="6"/>
  </g>
  <g class="head" text-anchor="middle">
    <text x="85" y="82">Client</text>
    <text x="270" y="82">Controller</text>
    <text x="460" y="82">Service</text>
    <text x="650" y="82">Price repository</text>
    <text x="855" y="82">Vendor / instrument repos</text>
  </g>

  <g class="life">
    <path d="M85 100V505 M270 100V505 M460 100V505 M650 100V505 M855 100V505"/>
  </g>

  <g fill="none" class="call" marker-end="url(#arrow)">
    <path d="M85 145H270"/>
    <path d="M270 205H460"/>
    <path d="M460 250H650"/>
    <path d="M460 335H855"/>
  </g>
  <g fill="none" class="reply" marker-end="url(#return)">
    <path d="M650 290H460"/>
    <path d="M855 375H460"/>
    <path d="M460 415H270"/>
    <path d="M270 455H85"/>
  </g>

  <g class="label" text-anchor="middle">
    <text x="178" y="138">GET /getAllPrices</text>
    <text x="365" y="198">getAllPrices()</text>
    <text x="555" y="243">findAll()</text>
    <text x="555" y="283">All current prices</text>
    <text x="657" y="328">For each price: look up vendor</text>
    <text x="657" y="348">and instrument details</text>
    <text x="657" y="368">Vendor / instrument records</text>
    <text x="365" y="408">Join details and sort by vendor ID,</text>
    <text x="365" y="425">then instrument ID</text>
    <text x="178" y="448">200 OK with all prices</text>
  </g>

  <rect x="25" y="516" width="910" height="28" rx="5" fill="#fff4e5" stroke="#f0bd73"/>
  <text x="38" y="535" font-size="13">Returns an empty list when no prices have been published.</text>
</svg>
