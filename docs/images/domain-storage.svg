<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">In-memory repository representation</title>
  <desc id="desc">Instrument and vendor repositories are maps keyed by their IDs. The price repository is a nested map keyed by instrument ID and then vendor ID.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}
      .title{font-size:21px;font-weight:bold}
      .label{font-size:15px;font-weight:bold}
      .code{font-family:Consolas,monospace;font-size:15px}
      .note{font-size:13px;fill:#475569}
      .repo{fill:#eaf2ff;stroke:#7193c6;stroke-width:1.5}
      .map{fill:#f8fbff;stroke:#94a3b8;stroke-width:1.2}
      .line{stroke:#64748b;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="980" height="470" rx="10" fill="#fff"/>
  <text x="24" y="34" class="title">In-memory repository representation</text>

  <rect x="34" y="92" width="250" height="56" rx="7" class="repo"/>
  <text x="159" y="126" text-anchor="middle" class="label">InstrumentRepository</text>
  <path d="M159 148V195" class="line" marker-end="url(#arrow)"/>
  <rect x="34" y="205" width="250" height="74" rx="7" class="map"/>
  <text x="159" y="234" text-anchor="middle" class="code">Map&lt;String, Instrument&gt;</text>
  <text x="159" y="260" text-anchor="middle" class="note">key: instrument ID</text>

  <rect x="365" y="92" width="250" height="56" rx="7" class="repo"/>
  <text x="490" y="126" text-anchor="middle" class="label">VendorRepository</text>
  <path d="M490 148V195" class="line" marker-end="url(#arrow)"/>
  <rect x="365" y="205" width="250" height="74" rx="7" class="map"/>
  <text x="490" y="234" text-anchor="middle" class="code">Map&lt;String, Vendor&gt;</text>
  <text x="490" y="260" text-anchor="middle" class="note">key: vendor ID</text>

  <rect x="696" y="92" width="250" height="56" rx="7" class="repo"/>
  <text x="821" y="126" text-anchor="middle" class="label">PriceRepository</text>
  <path d="M821 148V195" class="line" marker-end="url(#arrow)"/>
  <rect x="666" y="205" width="310" height="106" rx="7" class="map"/>
  <text x="821" y="235" text-anchor="middle" class="code">Map&lt;String, Map&lt;String, Price&gt;&gt;</text>
  <text x="821" y="263" text-anchor="middle" class="note">outer key: instrument ID</text>
  <text x="821" y="287" text-anchor="middle" class="note">inner key: vendor ID</text>

  <rect x="101" y="337" width="778" height="80" rx="7" fill="#fff4e5" stroke="#f0bd73"/>
  <text x="490" y="368" text-anchor="middle" class="label">One current quote per vendor/instrument pair</text>
  <text x="490" y="395" text-anchor="middle" class="note">Saving the same pair replaces its previous Price; repositories are in-memory and not durable.</text>
</svg>
