<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Market Price Hub domain model</title>
  <desc id="desc">Vendor and Instrument records each have IDs and names. A Price record references one vendor and one instrument by ID and has an amount and timestamp.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}
      .title{font-size:21px;font-weight:bold}
      .className{font-size:17px;font-weight:bold}
      .field{font-size:15px}
      .note{font-size:13px;fill:#475569}
      .box{fill:#f8fbff;stroke:#7193c6;stroke-width:1.5}
      .line{stroke:#64748b;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="920" height="470" rx="10" fill="#fff"/>
  <text x="24" y="34" class="title">Market Price Hub domain model</text>

  <rect x="55" y="100" width="270" height="135" rx="7" class="box"/>
  <path d="M55 143H325" stroke="#7193c6"/>
  <text x="190" y="129" text-anchor="middle" class="className">Vendor</text>
  <text x="78" y="174" class="field">id: String</text>
  <text x="78" y="204" class="field">name: String</text>

  <rect x="595" y="100" width="270" height="135" rx="7" class="box"/>
  <path d="M595 143H865" stroke="#7193c6"/>
  <text x="730" y="129" text-anchor="middle" class="className">Instrument</text>
  <text x="618" y="174" class="field">id: String</text>
  <text x="618" y="204" class="field">name: String</text>

  <rect x="325" y="290" width="270" height="150" rx="7" class="box"/>
  <path d="M325 333H595" stroke="#7193c6"/>
  <text x="460" y="319" text-anchor="middle" class="className">Price</text>
  <text x="348" y="362" class="field">vendorId: String</text>
  <text x="348" y="388" class="field">instrumentId: String</text>
  <text x="348" y="414" class="field">price: BigDecimal</text>
  <text x="348" y="436" class="field">priceDate: LocalDateTime</text>

  <path d="M325 180 C370 180 385 246 425 290" class="line" marker-end="url(#arrow)"/>
  <path d="M595 180 C550 180 535 246 495 290" class="line" marker-end="url(#arrow)"/>
  <text x="335" y="223" class="note">1 vendor</text>
  <text x="514" y="223" class="note">1 instrument</text>
  <text x="31" y="278" class="note">0..* prices per vendor, across instruments</text>
  <text x="584" y="278" class="note">0..* prices per instrument, across vendors</text>
  <text x="460" y="462" text-anchor="middle" class="note">Price stores IDs, not object references; each vendor/instrument pair has one current price.</text>
</svg>
