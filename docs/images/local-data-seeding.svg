<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Local profile startup and demo-data loading sequence</title><desc id="desc">Spring Boot requires an active profile. Under local, the seeder reads the CSV and saves vendor, instrument, and price records to their repositories.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="return" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:13px}.head{font-size:13px;font-weight:bold}.reply{stroke:#64748b;stroke-dasharray:6 4}.call{stroke:#334155}.life{stroke:#94a3b8;stroke-dasharray:5 5}</style>
  </defs>
  <rect width="960" height="500" rx="10" fill="#fff"/><text x="24" y="32" font-size="21" font-weight="bold">Local profile startup and demo-data loading</text>
  <g fill="#eaf2ff" stroke="#7193c6"><rect x="28" y="54" width="140" height="46" rx="6"/><rect x="218" y="54" width="140" height="46" rx="6"/><rect x="408" y="54" width="140" height="46" rx="6"/><rect x="598" y="54" width="140" height="46" rx="6"/><rect x="788" y="54" width="140" height="46" rx="6"/></g>
  <g class="head" text-anchor="middle"><text x="98" y="82">Spring Boot</text><text x="288" y="82">DataSeeder</text><text x="478" y="82">Vendor repo</text><text x="668" y="82">Instrument repo</text><text x="858" y="82">Price repo</text></g>
  <g class="life"><path d="M98 100V410 M288 100V410 M478 100V410 M668 100V410 M858 100V410"/></g>
  <path d="M98 145H288" fill="none" class="call" marker-end="url(#arrow)"/>
  <path d="M288 190H98" fill="none" class="reply" marker-end="url(#return)"/>
  <g fill="none" class="call" marker-end="url(#arrow)"><path d="M288 245H478"/><path d="M288 295H668"/><path d="M288 345H858"/></g>
  <g fill="none" class="reply" marker-end="url(#return)"><path d="M478 265H288"/><path d="M668 315H288"/><path d="M858 365H288"/><path d="M288 395H98"/></g>
  <g class="label" text-anchor="middle"><text x="193" y="138">Require active profile</text><text x="193" y="183">local profile: run seeder</text><text x="383" y="238">save(Vendor) rows</text><text x="383" y="258">Saved</text><text x="478" y="288">save(Instrument) rows</text><text x="478" y="308">Saved</text><text x="573" y="338">save(Price) rows</text><text x="573" y="358">Saved</text><text x="193" y="388">Startup continues</text></g>
  <rect x="28" y="430" width="900" height="42" rx="5" fill="#fff4e5" stroke="#f0bd73"/><text x="42" y="456" font-size="13">No active profile: startup is rejected. Demo data is loaded only with the local profile.</text>
</svg>
